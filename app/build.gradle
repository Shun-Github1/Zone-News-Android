// Release signing credentials are read from keystore.properties, which is gitignored.
// Copy keystore.properties.example to get started. Without that file, release builds are
// left unsigned rather than failing, so a clean checkout can always run assembleDebug.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    namespace = 'com.searcher.zonenews'
    compileSdk = 34

    defaultConfig {
        applicationId = "com.searcher.zonenews"
        minSdk = 24
        targetSdk = 34
        versionCode = 11
        versionName = "1.2.9"
        ndk {
            //设置支持的SO库架构（开发者可以根据需要，选择一个或多个平台的so）
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose = false
        viewBinding = true
    }
    
    lint {
        // Allow build to continue even with lint errors
        abortOnError = false
        // Create baseline for tracking new lint issues
        baseline = file("lint-baseline.xml")
    }
}


